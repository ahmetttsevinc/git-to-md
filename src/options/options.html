<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>git.to.md settings</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.5 system-ui, sans-serif; margin: 12px; }
      fieldset { border: none; padding: 0; margin: 0 0 12px; }
      legend { font-weight: 600; margin-bottom: 4px; }
      label { display: block; padding: 3px 0; }
      small { display: block; margin-left: 22px; opacity: 0.7; }
      #saved { opacity: 0.7; }
    </style>
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <fieldset>
      <legend>Source</legend>
      <label><input type="radio" name="source" value="auto" /> Auto — GitLab API, fall back to the page</label>
      <label><input type="radio" name="source" value="api" /> GitLab API only</label>
      <label><input type="radio" name="source" value="dom" /> Page only (no extra requests)</label>
      <small>The API is called on your own GitLab server with your existing session. Nothing is sent anywhere else.</small>
    </fieldset>
    <fieldset>
      <legend>Content</legend>
      <label><input type="checkbox" name="includeTimestamps" /> Dates (created, closed, comment dates)</label>
      <label><input type="checkbox" name="includeLinks" /> Linked issues</label>
      <label><input type="checkbox" name="includeResolved" /> Resolved threads</label>
      <label><input type="checkbox" name="includeSystemNotes" /> System notes</label>
      <small>“added label”, “changed milestone”… Usually noise.</small>
    </fieldset>
    <fieldset>
      <legend>Cleanup</legend>
      <label><input type="checkbox" name="stripImages" /> Replace images with <code>[image: alt]</code></label>
      <label><input type="checkbox" name="stripHtmlComments" /> Remove HTML comments (issue template hints)</label>
      <label><input type="checkbox" name="demoteHeadings" /> Nest headings under the issue title</label>
    </fieldset>
    <fieldset>
      <legend>Behaviour</legend>
      <label><input type="checkbox" name="autoCopy" /> Copy to clipboard when the popup opens</label>
    </fieldset>
    <span id="saved" role="status"></span>
  </body>
</html>
